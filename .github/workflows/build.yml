name: Build NovaClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source if it was uploaded as a zip
        shell: bash
        run: |
          if [ -z "$(find . -type f -name build.gradle -not -path '*/.gradle/*' -print -quit)" ]; then
            for z in *.zip; do
              [ -e "$z" ] && unzip -oq "$z"
            done
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.12
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.12-bin.zip \
            --output /tmp/gradle-8.12-bin.zip
          unzip -q /tmp/gradle-8.12-bin.zip -d /tmp
          echo "/tmp/gradle-8.12/bin" >> "$GITHUB_PATH"

      - name: Find Gradle project and build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find . -type f -name build.gradle -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle was not found." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "Building Gradle project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
